name: Android code50 edge-to-edge and large display tests
on:
  workflow_dispatch:
  push:
    branches: [ce-play-edge50]
    paths: ['android-preview/**', '.github/workflows/android-display-code50.yml']
concurrency:
  group: code50-display-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            profile: pixel_7
            name: phone-android15
          - api: 36
            profile: pixel_tablet
            name: tablet-android16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell settings put secure immersive_mode_confirmations confirmed
            bash -c 'cd android-preview; gradle -PserkalDeviceTests assembleDebug assembleDebugAndroidTest || exit $?; adb install -r app/build/outputs/apk/debug/app-debug.apk || exit $?; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk || exit $?; cd ..; mkdir -p display-evidence; adb shell am instrument -w -e class de.serkal.android.preview.DisplayDeviceTest de.serkal.android.preview.v005.test/androidx.test.runner.AndroidJUnitRunner | tee display-evidence/instrumentation.txt; result=1; grep -q "OK (1 test)" display-evidence/instrumentation.txt && result=0; adb pull /sdcard/Android/data/de.serkal.android.preview.v005/files/ display-evidence/ || true; adb logcat -d > display-evidence/logcat.txt || true; exit $result'

      - name: Collect display evidence
        if: always()
        run: |
          mkdir -p display-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code50-${{ matrix.name }}-display-evidence
          path: |
            display-evidence/
            android-preview/app/build/reports/androidTests/
            android-preview/app/build/outputs/androidTest-results/
