name: SerKal Android Training APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-training-0.0.1
    paths:
      - "android-training/**"
      - ".github/workflows/android-training.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-training
    steps:
      - name: Quellstand holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Trainings-APK bauen
        run: gradle --no-daemon assembleDebug

      - name: Eindeutigen Dateinamen vergeben
        run: cp app/build/outputs/apk/debug/app-debug.apk serkal-android-training-0.0.1.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: serkal-android-training-0.0.1
          path: android-training/serkal-android-training-0.0.1.apk
          if-no-files-found: error
