name: Windows signing rehearsal
on:
  push:
    branches: [installer3-windows-signing-rehearsal]
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and run release tests
        shell: pwsh
        run: |
          npm.cmd ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create test certificate and package app
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SERKAL_GOOGLE_OAUTH_FILE = Join-Path $env:RUNNER_TEMP google_oauth_client.json
          '{"installed":{"client_id":"rehearsal.invalid","client_secret":"rehearsal"}}' | Set-Content $env:SERKAL_GOOGLE_OAUTH_FILE
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$tool) { throw 'Windows SDK SignTool missing' }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=SerKal Rehearsal Only' -CertStoreLocation Cert:\CurrentUser\My
          $cer = Join-Path $env:RUNNER_TEMP rehearsal.cer
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          certutil.exe -f -addstore Root $cer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "REHEARSAL_CERT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "SERKAL_GOOGLE_OAUTH_FILE=$env:SERKAL_GOOGLE_OAUTH_FILE" >> $env:GITHUB_ENV
          npm.cmd run package -- --platform=win32 --arch=x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign app with timestamp
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$tool) { throw 'Windows SDK SignTool missing' }
          $cert = Get-Item "Cert:\CurrentUser\My\$env:REHEARSAL_CERT"
          function Invoke-Checked($Program, [string[]]$Arguments) {
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program exited $LASTEXITCODE" }
          }
          function Confirm-Signature($File) {
            Invoke-Checked $tool.FullName @('verify','/pa','/all','/tw','/v',$File)
            $signature = Get-AuthenticodeSignature -LiteralPath $File
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint -or !$signature.TimeStamperCertificate) {
              throw "Invalid signature, signer or timestamp: $File"
            }
          }
          function Sign-File($File) {
            Invoke-Checked $tool.FullName @('sign','/sha1',$cert.Thumbprint,'/fd','SHA256','/tr','http://timestamp.digicert.com','/td','SHA256',$File)
            Confirm-Signature $File
          }
          $app = (Resolve-Path 'out\SerKal Desktop-win32-x64\SerKal Desktop.exe').Path
          Sign-File $app
      - name: Build Squirrel setup
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd run make -- --skip-package --platform=win32 --arch=x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign and verify setup and bundled executable
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$tool) { throw 'Windows SDK SignTool missing' }
          $cert = Get-Item "Cert:\CurrentUser\My\$env:REHEARSAL_CERT"
          function Invoke-Checked($Program, [string[]]$Arguments) {
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program exited $LASTEXITCODE" }
          }
          function Confirm-Signature($File) {
            Invoke-Checked $tool.FullName @('verify','/pa','/all','/tw','/v',$File)
            $signature = Get-AuthenticodeSignature -LiteralPath $File
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint -or !$signature.TimeStamperCertificate) {
              throw "Invalid signature, signer or timestamp: $File"
            }
          }
          function Sign-File($File) {
            Invoke-Checked $tool.FullName @('sign','/sha1',$cert.Thumbprint,'/fd','SHA256','/tr','http://timestamp.digicert.com','/td','SHA256',$File)
            Confirm-Signature $File
          }
          $app = (Resolve-Path 'out\SerKal Desktop-win32-x64\SerKal Desktop.exe').Path
          $output = 'out\make\squirrel.windows\x64'
          $setup = (Resolve-Path "$output\serkal-desktop-1-2-7-wartung-8-setup.exe").Path
          Sign-File $setup
          $package = @(Get-ChildItem $output -Filter '*-full.nupkg')
          if ($package.Count -ne 1) { throw 'Expected one full Squirrel package' }
          $unpacked = Join-Path $env:RUNNER_TEMP unpacked
          [IO.Compression.ZipFile]::ExtractToDirectory($package[0].FullName, $unpacked)
          $innerApp = @(Get-ChildItem $unpacked -Recurse -Filter 'SerKal Desktop.exe')
          if ($innerApp.Count -ne 1) { throw 'Expected one SerKal Desktop.exe in Squirrel package' }
          Confirm-Signature $innerApp[0].FullName
          if ((Get-FileHash $app).Hash -ne (Get-FileHash $innerApp[0].FullName).Hash) { throw 'Packaged application differs from signed application' }
          Get-FileHash $setup -Algorithm SHA256
      - name: Install and verify installed executable
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$tool) { throw 'Windows SDK SignTool missing' }
          $cert = Get-Item "Cert:\CurrentUser\My\$env:REHEARSAL_CERT"
          function Invoke-Checked($Program, [string[]]$Arguments) {
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program exited $LASTEXITCODE" }
          }
          function Confirm-Signature($File) {
            Invoke-Checked $tool.FullName @('verify','/pa','/all','/tw','/v',$File)
            $signature = Get-AuthenticodeSignature -LiteralPath $File
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint -or !$signature.TimeStamperCertificate) {
              throw "Invalid signature, signer or timestamp: $File"
            }
          }
          function Sign-File($File) {
            Invoke-Checked $tool.FullName @('sign','/sha1',$cert.Thumbprint,'/fd','SHA256','/tr','http://timestamp.digicert.com','/td','SHA256',$File)
            Confirm-Signature $File
          }
          $app = (Resolve-Path 'out\SerKal Desktop-win32-x64\SerKal Desktop.exe').Path
          $output = 'out\make\squirrel.windows\x64'
          $setup = (Resolve-Path "$output\serkal-desktop-1-2-7-wartung-8-setup.exe").Path
          $process = Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw 'Setup did not exit after 90 seconds' }
          if ($process.ExitCode -ne 0) { throw "Setup exited $($process.ExitCode)" }
          $installed = $null
          for ($i = 0; $i -lt 30 -and !$installed; $i++) {
            $installed = Get-ChildItem "$env:LOCALAPPDATA\SerKalDesktop\app-*\SerKal Desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (!$installed) { Start-Sleep -Seconds 2 }
          }
          if (!$installed) { throw 'Silent setup did not install the desktop executable' }
          Confirm-Signature $installed.FullName
          if ((Get-FileHash $app).Hash -ne (Get-FileHash $installed.FullName).Hash) { throw 'Installed application differs from signed application' }
