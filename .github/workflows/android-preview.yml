name: Test and build SerKal Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-preview/**'
      - 'serkal-release.json'
      - '.github/workflows/android-preview.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test
        working-directory: android-preview
        run: gradle testDebugUnitTest
      - name: Build unsigned APK
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build apk]')
        working-directory: android-preview
        run: |
          gradle assembleDebug
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build apk]')
        with:
          name: 030-SerKal-Android-unsigned
          path: |
            android-preview/app/build/outputs/apk/debug/app-debug-unsigned.apk
            android-preview/apksigner.jar
            android-preview/app/build/test-results/testDebugUnitTest/*.xml
