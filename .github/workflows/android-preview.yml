name: Test and build SerKal Android App Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-preview/**'
      - 'serkal-release.json'
      - '.github/workflows/android-preview.yml'

concurrency:
  group: android-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test
        working-directory: android-preview
        run: gradle testReleaseUnitTest
      - name: Build unsigned Android App Bundle
        working-directory: android-preview
        run: gradle bundleRelease
      - name: Record bundle metadata
        working-directory: android-preview
        run: |
          sha256sum app/build/outputs/bundle/release/app-release.aab > app-release.aab.sha256
          printf 'sourceCommit=%s\nversionName=1.2.4\nversionCode=47\napplicationId=de.serkal.android.preview.v005\n' "$GITHUB_SHA" > app-release.aab.metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SerKal-Android-1.2.4-code47-unsigned-aab
          path: |
            android-preview/app/build/outputs/bundle/release/app-release.aab
            android-preview/app-release.aab.sha256
            android-preview/app-release.aab.metadata.txt
            android-preview/app/build/test-results/testReleaseUnitTest/*.xml
