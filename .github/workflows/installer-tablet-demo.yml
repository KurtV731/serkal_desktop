name: Installer tablet demo APK
on:
  push:
    branches: [installer-tablet-prueferdemo]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58022a5b74fc8f4804358eebbfdca85e6b838d62
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build separately installable debug APK
        working-directory: android-preview
        run: |
          sed -i "/buildTypes { debug/c\    buildTypes { debug { applicationIdSuffix '.tablet.demo'; versionNameSuffix '-tablet-demo' } }" app/build.gradle
          grep -F "applicationIdSuffix '.tablet.demo'" app/build.gradle
          sed -i "s/previewVersion + ' - SerKal Android'/'SerKal Tablet-Demo'/" app/build.gradle
          sed -i 's/versionCode releaseInfo.androidVersionCode as int/versionCode 55/' app/build.gradle
          gradle assembleDebug
          mkdir -p demo-output
          cp app/build/outputs/apk/debug/app-debug.apk demo-output/SerKal-Tablet-Prueferdemo-R3.apk
          sdk_build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$sdk_build_tools/apksigner" verify --print-certs demo-output/SerKal-Tablet-Prueferdemo-R3.apk
          "$sdk_build_tools/aapt" dump badging demo-output/SerKal-Tablet-Prueferdemo-R3.apk > demo-output/metadata.txt
          grep -F "package: name='de.serkal.android.preview.v005.tablet.demo'" demo-output/metadata.txt
          cd demo-output
          sha256sum SerKal-Tablet-Prueferdemo-R3.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SerKal-Tablet-Prueferdemo
          path: android-preview/demo-output/
