plugins { id 'com.android.application' }

android {
    namespace 'de.serkal.android.preview'
    compileSdk 35

    defaultConfig {
        // Eigene Kennung je Teststufe: 0.0.4 kann neben den älteren
        // Präversionen installiert werden, auch wenn deren Debug-Signatur abweicht.
        applicationId 'de.serkal.android.preview.v005'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '0.0.5a2'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

